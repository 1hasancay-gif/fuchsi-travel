<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<link rel="manifest" href="./manifest.webmanifest">
<title>Fuchsi Travel 🦊</title>
<style>
:root{--o:#ff6a00;--b:#1261c9;--cream:#fff8ef;--ink:#16212e;--muted:#6f7a86;--green:#27c968;--card:#fff;--shadow:0 8px 24px rgba(20,35,55,.1)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0d5ac2 0 22%,#eaf6ff 22% 24%,var(--cream) 24%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button{font:inherit;border:0;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh}.top{padding:16px 14px 8px;color:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;font-size:22px}.pill{padding:7px 9px;border-radius:14px;background:#ffffff26;border:1px solid #ffffff35;font-size:12px;font-weight:800}.screen{padding:0 14px 100px}.hero{background:#cfeaff;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);margin-top:8px}.hero img{width:100%;height:270px;object-fit:cover;display:block}.bubble{background:#fff;margin:-30px 12px 0;position:relative;border-radius:18px;padding:12px;box-shadow:var(--shadow)}.bubble small{display:block;color:var(--muted);margin-top:4px}.card{background:#fff;border-radius:20px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}.bar{height:9px;background:#e9edf1;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#58e57f)}.cta{width:100%;padding:14px;border-radius:15px;background:linear-gradient(90deg,var(--o),#ff7f14);color:#fff;font-weight:900;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{text-align:center;background:#fff;border-radius:16px;padding:12px 5px;box-shadow:var(--shadow);font-size:12px;font-weight:800}.tile b{display:block;font-size:23px;margin-bottom:4px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #eee;backdrop-filter:blur(14px)}.navin{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;color:#68737f;padding:10px 2px 12px;font-size:11px;font-weight:800}.nav button.active{color:var(--o)}.nav b{display:block;font-size:21px}.head{display:flex;align-items:center;gap:8px;padding:10px 0}.back{background:none;font-size:28px}.lesson{display:flex;gap:11px;align-items:center}.ico{width:44px;height:44px;border-radius:14px;background:#eef6ff;display:grid;place-items:center;font-size:22px}.meta{flex:1}.small{font-size:12px;color:var(--muted)}.challenge{background:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.word{font-size:30px;font-weight:950;text-align:center;margin:18px 0}.choice{width:100%;padding:13px;border:2px solid #e7eaee;border-radius:14px;background:#fff;text-align:left;font-weight:800;margin-top:8px}.good{border-color:#32d779;background:#effdf4}.bad{border-color:#ff7777;background:#fff0f0}.chat{display:flex;gap:8px;margin:10px 0}.chat.you{justify-content:flex-end}.msg{background:#fff;border-radius:17px;padding:11px 12px;box-shadow:var(--shadow);max-width:84%}.you .msg{background:#dff0ff}.inputrow{display:flex;gap:7px;background:#fff;border-radius:18px;padding:8px;box-shadow:var(--shadow);position:sticky;bottom:76px}.inputrow input{flex:1;border:0;outline:0;background:#f7f8f9;border-radius:13px;padding:10px}.send{width:46px;border-radius:13px;background:var(--o);color:#fff}.hidden{display:none}.avatarGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.av{background:#fff;border-radius:16px;padding:8px;border:2px solid transparent;text-align:center}.av.sel{border-color:var(--o)}.face{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#ffe4cf;font-size:35px}.fallback{padding:60px 18px;text-align:center}.fallback h1{margin:0 0 8px}.fallback p{color:var(--muted)}
</style>
</head>
<body>
<div id="app" class="app"><div class="fallback"><h1>🦊 Fuchsi Travel</h1><p>Deutsch lernen. Deutschland entdecken.</p><p>Uygulama yükleniyor…</p></div></div>
<script>
(function(){
'use strict';
try{
const defaults={name:'Hasan',fp:0,coins:120,streak:1,unit:1,avatar:'🧑🏻‍💼',daily:0};
let state=defaults;
try{const s=JSON.parse(localStorage.getItem('fuchsi')||'null');if(s&&typeof s==='object')state=Object.assign({},defaults,s)}catch(_){ }
const units=[
['Selamlaşma','Hallo · Guten Morgen · Guten Tag · Guten Abend · Tschüss','👋'],
['Kendini Tanıtma','Ich heiße… · Ich bin… · Wo wohnst du?','🙋'],
['Ülkeler & Diller','Deutschland · Türkei · Deutsch · Türkisch','🌍'],
['Aile','meine Mutter · mein Bruder · Ich habe…','👨‍👩‍👧'],
['Sayılar & Telefon','0–100 · Telefonnummer · Preis','🔢'],
['Saat & Tarih','Wie spät ist es? · Heute ist…','⏰'],
['Günlük Rutin','Ich arbeite · Ich lerne · Ich schlafe','☀️'],
['Ev & Oda','Zimmer · Küche · Bett · Tisch','🏠'],
['Şehir & Yön','Wo ist…? · links · rechts · geradeaus','🗺️'],
['Ulaşım','Bus · Zug · Bahnhof · Ticket','🚆'],
['İş & Okul','Arbeit · Beruf · Schule · Termin','💼'],
['Alışveriş','Ich möchte… · Wie viel kostet das?','🛍️'],
['Yeme & İçme','Essen · Trinken · Frühstück','🍎'],
['Restoran','Speisekarte · Rechnung · Bestellung','🍽️'],
['Sağlık','Arzt · Apotheke · Schmerzen','🩺'],
['Hava & Mevsimler','Sonne · Regen · kalt · warm','🌦️'],
['Hobi & Boş Zaman','Musik · Fußball · Freunde','🎮'],
['Seyahat & Otel','Zimmer · Ankunft · Abfahrt','🧳'],
['Mesaj & Randevu','Termin · treffen · absagen','💬'],
['A1 Final','Hören · Lesen · Schreiben · Sprechen','🏆']
];
function save(){try{localStorage.setItem('fuchsi',JSON.stringify(state))}catch(_){} }
function greet(){const h=new Date().getHours();return h<5?'Gute Nacht':h<11?'Guten Morgen':h<18?'Guten Tag':h<22?'Guten Abend':'Gute Nacht'}
function addFP(n){state.fp=(state.fp||0)+n;state.coins=(state.coins||0)+Math.floor(n/20);save()}
function nav(active){return '<div class="nav"><div class="navin">'+[['home','🏠','Ana Sayfa'],['map','🗺️','Almanya'],['lessons','📚','Dersler'],['fuchsi','🦊','Fuchsi'],['profile','👤','Profil']].map(x=>'<button class="'+(active===x[0]?'active':'')+'" onclick="window.ft('+JSON.stringify(x[0])+')"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></div>'}
function render(body,active){document.getElementById('app').innerHTML=body+nav(active)}
function top(){return '<div class="top"><div class="row"><div class="brand">🦊 Fuchsi Travel</div><div class="row"><span class="pill">🔥 '+(state.streak||1)+'</span><span class="pill">⭐ '+(state.fp||0)+'</span><span class="pill">🪙 '+(state.coins||0)+'</span></div></div></div>'}
function home(){render(top()+'<main class="screen"><div class="hero"><img src="fuchsi_hero.png" alt="Fuchsi"><div class="bubble"><b>'+greet()+', '+state.name+'! ☀️</b><small>Heute lernen wir in Berlin. Fuchsi hazır. 🦊</small></div></div><div class="card"><div class="small">Level 1 · Berlin</div><b>Selamlaşma</b><div class="bar"><i style="width:'+Math.min(100,(state.fp%500)/5)+'%"></i></div><div class="small">'+(state.fp%500)+' / 500 FP</div><button class="cta" onclick="window.ftLesson(0)">Derse Başla 🚀</button></div><div class="grid" style="margin-top:12px"><div class="tile" onclick="window.ft('lessons')"><b>📗</b>Kelimeler</div><div class="tile" onclick="window.ft('lessons')"><b>💬</b>Kalıplar</div><div class="tile" onclick="window.ft('lessons')"><b>🎓</b>Gramer</div><div class="tile" onclick="window.ft('map')"><b>🇩🇪</b>Almanya</div></div><div class="card"><b>🔥 Günlük hedef</b><div class="small">Bugün '+(state.daily||0)+' ders tamamlandı.</div></div></main>','home')}
function lessons(){render(top()+'<main class="screen"><div class="head"><button class="back" onclick="window.ft(\'home\')">‹</button><div><h2 style="margin:0">Dersler</h2><div class="small">A1 · 20 bölüm</div></div></div>'+units.map((u,i)=>'<div class="card" onclick="window.ftLesson('+i+')"><div class="lesson"><div class="ico">'+u[2]+'</div><div class="meta"><b>'+(i+1)+'. '+u[0]+'</b><div class="small">'+u[1]+'</div></div><span>'+(i<3?'✅':i<=state.unit?'▶️':'🔒')+'</span></div></div>').join('')+'</main>','lessons')}
function lesson(i){const u=units[i];const examples=[['Hallo!','Merhaba!'],['Ich heiße '+state.name+'.','Benim adım '+state.name+'.'],['Ich komme aus der Türkei.','Türkiye’den geliyorum.'],['Das ist meine Mutter.','Bu benim annem.'],['Meine Telefonnummer ist…','Telefon numaram…'],['Wie spät ist es?','Saat kaç?'],['Ich arbeite am Montag.','Pazartesi çalışıyorum.'],['Das ist meine Küche.','Bu benim mutfağım.'],['Wo ist der Bahnhof?','Tren istasyonu nerede?'],['Ich fahre mit dem Bus.','Otobüsle gidiyorum.'],['Ich kann heute nicht.','Bugün yapamam.'],['Ich möchte einen Kaffee.','Bir kahve istiyorum.'],['Ich esse gern Äpfel.','Elma yemeyi severim.'],['Die Rechnung, bitte.','Hesabı alabilir miyim?'],['Ich habe Kopfschmerzen.','Başım ağrıyor.'],['Heute ist es kalt.','Bugün hava soğuk.'],['Ich mag Musik.','Müziği severim.'],['Ich habe ein Zimmer reserviert.','Bir oda rezerve ettim.'],['Hast du am Freitag Zeit?','Cuma vaktin var mı?'],['Ich kann mich vorstellen.','Kendimi tanıtabilirim.']];const ex=examples[i]||examples[0];render(top()+'<main class="screen"><div class="head"><button class="back" onclick="window.ft(\'lessons\')">‹</button><div><h2 style="margin:0">'+u[0]+'</h2><div class="small">Adım 1 · Anla → Dinle → Hatırla → Üret</div></div></div><div class="challenge"><div style="font-size:38px;text-align:center">'+u[2]+'</div><h2 style="text-align:center">'+u[0]+'</h2><p><b>'+ex[0]+'</b><br><span class="small">'+ex[1]+'</span></p><button class="speaker" onclick="window.ftSpeak('+JSON.stringify(ex[0])+')">🔊 Dinle</button><button class="cta" onclick="window.ftComplete('+i+')">Anladım — Devam Et</button></div></main>','lessons')}
function mapPage(){render(top()+'<main class="screen"><div class="head"><button class="back" onclick="window.ft(\'home\')">‹</button><h2 style="margin:0">Almanya Yolculuğu</h2></div>'+[['Berlin','Selamlaşma','🇩🇪'],['Hamburg','Kendini Tanıtma','⚓'],['Köln','Aile','⛪'],['München','Günlük Rutin','🏔️'],['Frankfurt','A1 Final','🏆']].map((x,i)=>'<div class="card" onclick="'+(i<=state.unit?'window.ftLesson('+(i*4)+')':'alert(\'Önceki bölümü tamamla 🔒\')')+'"><div class="lesson"><div class="ico">'+x[2]+'</div><div class="meta"><b>'+x[0]+'</b><div class="small">'+x[1]+'</div></div><span>'+(i<=state.unit?'✨':'🔒')+'</span></div></div>').join('')+'</main>','map')}
function fuchsi(){render(top()+'<main class="screen"><div class="head"><button class="back" onclick="window.ft(\'home\')">‹</button><div><h2 style="margin:0">Fuchsi ile Sohbet</h2><div class="small">A1 · Hata yap, düzelt, tekrar et 🦊</div></div></div><div id="chat" class="card"><div class="chat"><div class="msg"><b>Hallo '+state.name+'!</b><br>Wie geht’s dir heute?</div></div></div><div class="inputrow"><input id="chatin" placeholder="Örn. Mir geht gut."><button class="send" onclick="window.ftSend()">➤</button></div></main>','fuchsi')}
function send(){const inp=document.getElementById('chatin'),v=inp.value.trim();if(!v)return;const b=document.getElementById('chat');b.innerHTML+='<div class="chat you"><div class="msg">'+esc(v)+'</div></div>';let r='Sehr gut! 🦊 A1 seviyesinde devam edelim.';if(v.toLowerCase().includes('mir geht gut'))r='<b>Fast!</b> Doğrusu: <b>Mir geht es gut.</b><br>Burada “es” gerekir.';if(v.toLowerCase().includes('hallo'))r='Sehr gut! 👏 Şimdi: <b>Wie geht’s dir?</b>';b.innerHTML+='<div class="chat"><div class="msg">'+r+'</div></div>';inp.value='';addFP(5)}
function profile(){render(top()+'<main class="screen"><div class="head"><h2 style="margin:0">Profil</h2></div><div class="card" style="text-align:center"><div style="font-size:88px">'+state.avatar+'</div><b style="font-size:20px">'+state.name+'</b><div class="small">Level 1 · Berlin</div></div><div class="grid" style="margin-top:12px"><div class="tile"><b>🔥</b>'+(state.streak||1)+'</div><div class="tile"><b>⭐</b>'+(state.fp||0)+'</div><div class="tile"><b>🪙</b>'+(state.coins||0)+'</div><div class="tile"><b>📚</b>'+state.unit+'/20</div></div><button class="cta" onclick="window.ftAvatar()">Avatarı Düzenle</button></main>','profile')}
function avatar(){const fs=['🧑🏻‍💼','👩🏻‍💼','🧑🏽‍🎓','👩🏽‍🎓','🧑🏿‍💻','👩🏿‍💻','🧔🏻','👩🏻‍🦰','👨🏽‍🦱','👩🏽‍🦱','🧑🏼‍🎨','👨🏻‍🦲'];render(top()+'<main class="screen"><div class="head"><button class="back" onclick="window.ft(\'profile\')">‹</button><h2 style="margin:0">Avatarını oluştur</h2></div><div class="card" style="text-align:center"><div style="font-size:88px">'+state.avatar+'</div><div class="avatarGrid">'+fs.map(f=>'<div class="av '+(state.avatar===f?'sel':'')+'" onclick="window.ftPick('+JSON.stringify(f)+')"><div class="face">'+f+'</div></div>').join('')+'</div></div></main>','profile')}
function pick(f){state.avatar=f;save();avatar()}
function esc(s){return s.replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
window.ft=function(x){if(x==='home')home();else if(x==='lessons')lessons();else if(x==='map')mapPage();else if(x==='fuchsi')fuchsi();else if(x==='profile')profile()};
window.ftLesson=lesson; window.ftAvatar=avatar; window.ftPick=pick; window.ftSend=send;
window.ftSpeak=function(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;speechSynthesis.speak(u)}catch(_){} };
window.ftComplete=function(i){addFP(25);state.unit=Math.max(state.unit,i+1);state.daily=Math.min(5,(state.daily||0)+1);save();lessons()};
home();
}catch(err){document.getElementById('app').innerHTML='<div class="fallback"><h1>🦊 Fuchsi Travel</h1><p>Uygulama başlatılırken bir hata oluştu.</p><p>'+String(err&&err.message||err)+'</p><button class="cta" onclick="location.reload()">Tekrar Dene</button></div>'}
})();
</script>
</body></html>
