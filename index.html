<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Fuchsi Travel</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#ff6a00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fuchsi Travel">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{--orange:#ff6a00;--orange2:#ff8a2b;--blue:#1261c9;--sky:#dff0ff;--cream:#fff8ef;--card:#fff;--ink:#16212e;--muted:#6f7a86;--green:#2ccf68;--red:#f85a5a;--purple:#8b5cf6;--shadow:0 8px 28px rgba(20,35,55,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d5ac2 0,#eef7ff 21%,var(--cream) 21%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh}.top{padding:16px 14px 6px;color:white;position:sticky;top:0;z-index:5}.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px;text-shadow:0 2px 0 rgba(0,0,0,.15)}.stats{display:flex;gap:7px}.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(12px);padding:7px 9px;border-radius:14px;font-weight:800;font-size:12px}.screen{padding:4px 14px 92px}.hero{margin-top:8px;border-radius:28px;overflow:hidden;background:#cfeaff;box-shadow:var(--shadow);position:relative;min-height:260px}.hero img{width:100%;height:290px;object-fit:cover;object-position:18% 42%;display:block;filter:saturate(1.05)}.bubble{position:absolute;top:16px;right:10px;left:45%;background:#fff;padding:12px 14px;border-radius:18px 18px 5px 18px;box-shadow:var(--shadow);font-weight:800}.bubble small{display:block;color:var(--muted);margin-top:4px;font-weight:600}.levelcard{margin:-26px 10px 0;position:relative;background:white;border-radius:22px;padding:14px;box-shadow:var(--shadow)}.lvlrow{display:flex;gap:10px;align-items:center}.citythumb{width:58px;height:45px;border-radius:14px;object-fit:cover}.lvlname{font-weight:900}.bar{height:10px;background:#e8edf1;border-radius:99px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#56e47d);border-radius:99px}.small{font-size:12px;color:var(--muted)}.cta{width:100%;padding:14px;border-radius:15px;background:linear-gradient(90deg,var(--orange),#ff7e12);color:white;font-weight:900;font-size:16px;margin-top:12px;box-shadow:0 8px 18px rgba(255,106,0,.25)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.tile{background:white;border-radius:18px;padding:11px 7px;box-shadow:var(--shadow);text-align:center;font-size:12px;font-weight:800}.tile b{display:block;font-size:25px;margin-bottom:4px}.section{margin-top:16px}.section h3{margin:0 0 9px;font-size:16px}.rowcard{background:white;border-radius:18px;padding:13px;box-shadow:var(--shadow);margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);display:flex;justify-content:center;z-index:10;border-top:1px solid #eee}.navin{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{padding:10px 2px 12px;background:none;color:#65727f;font-size:11px;font-weight:800}.nav button.active{color:var(--orange)}.nav button b{display:block;font-size:22px;line-height:24px}.back{border:0;background:none;font-size:26px}.pagehead{display:flex;align-items:center;gap:8px;padding:8px 0}.pagehead h2{margin:0;font-size:20px}.sub{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 12px}.tab{padding:8px 13px;border-radius:999px;background:#eef1f5;color:#5c6974;font-weight:800;font-size:12px;white-space:nowrap}.tab.on{background:var(--orange);color:white}.lesson{display:flex;gap:11px;align-items:center}.lesson .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#f1f7ff;font-size:21px}.lesson .meta{flex:1}.lesson strong{display:block}.lock{font-size:18px}.progressline{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden}.progressline i{display:block;height:100%;background:var(--blue);border-radius:99px}.map{background:linear-gradient(#cfefff,#c8e2bd 32%,#b0d4a0 100%);border-radius:26px;padding:18px;min-height:610px;box-shadow:var(--shadow);position:relative;overflow:hidden}.map:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.55),transparent 26%),radial-gradient(circle at 15% 78%,rgba(255,255,255,.4),transparent 24%)}.route{position:absolute;left:25%;top:18%;height:62%;width:52%;border-left:6px dotted rgba(255,255,255,.95);transform:rotate(14deg);z-index:1}.city{position:absolute;z-index:2;background:white;border-radius:18px;padding:9px 11px;box-shadow:var(--shadow);font-weight:900;font-size:12px}.city small{display:block;color:var(--muted);font-weight:700}.city.berlin{top:13%;left:54%}.city.hamburg{top:28%;left:45%}.city.koln{top:43%;left:37%}.city.munich{top:61%;left:56%}.city.frank{top:76%;left:45%}.city.locked{opacity:.62}.challenge{background:white;border-radius:24px;padding:18px;box-shadow:var(--shadow)}.word{font-size:34px;font-weight:950;text-align:center;margin:12px 0}.meaning{text-align:center;color:#15964a;font-weight:900}.speaker{width:56px;height:56px;border-radius:50%;background:#1670ff;color:white;display:grid;place-items:center;font-size:25px;margin:10px auto}.choice{width:100%;padding:13px;border:2px solid #e7eaee;border-radius:14px;background:#fff;text-align:left;font-weight:800;margin-top:8px}.choice.good{border-color:#35d67b;background:#effdf4}.choice.bad{border-color:#ff7a7a;background:#fff1f1}.chat{display:flex;gap:8px;margin:10px 0}.chat .foxmini{width:36px;height:36px;border-radius:12px;object-fit:cover}.bubblemsg{background:white;border-radius:17px;padding:11px 12px;box-shadow:var(--shadow);max-width:82%;font-size:14px}.you{justify-content:flex-end}.you .bubblemsg{background:#dff0ff}.inputrow{display:flex;gap:7px;background:white;padding:8px;border-radius:18px;box-shadow:var(--shadow);position:sticky;bottom:76px}.inputrow input{flex:1;border:0;outline:0;padding:10px;background:#fafafa;border-radius:13px}.send{width:44px;border-radius:13px;background:var(--orange);color:#fff}.avatarGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.av{background:white;border-radius:18px;padding:7px;text-align:center;box-shadow:var(--shadow);border:2px solid transparent}.av.sel{border-color:var(--orange)}.av .face{width:62px;height:62px;border-radius:50%;margin:auto;display:grid;place-items:center;font-size:37px;background:#ffe4cf}.avatarPreview{background:linear-gradient(135deg,#dff0ff,#fff3e8);border-radius:24px;padding:15px;text-align:center;box-shadow:var(--shadow);margin-bottom:12px}.avatarBig{font-size:88px}.swatches{display:flex;gap:8px;justify-content:center;margin:10px 0}.sw{width:28px;height:28px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd}.daily{display:flex;align-items:center;gap:13px}.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 62%,#edf1f3 62% 100%);position:relative}.ring:after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}.ring span{position:relative;z-index:1;font-weight:950}.achievement{display:flex;gap:10px;align-items:center}.badge{width:44px;height:44px;border-radius:14px;background:#fff4d9;display:grid;place-items:center;font-size:23px}.muted{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:#152233;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;z-index:30;box-shadow:var(--shadow);font-size:13px}.tinybtn{padding:7px 10px;border-radius:12px;background:#f3f5f7;font-weight:800}.danger{color:var(--red)}
</style></head><body><div id="app" class="app"></div><div id="toast" class="toast hidden"></div>
<script>
const units=[
['Selamlaşma','Guten Morgen! · Hallo! · Tschüss!','Pronouns: ich/du · basic verb patterns','👋'],['Kendini Tanıtma','Ich heiße… · Ich bin… · Wo wohnst du?','sein · personal pronouns · W-Fragen','🙋'],['Ülkeler & Diller','Deutschland · Türkei · Deutsch · Türkisch','kommen aus · in/aus','🌍'],['Aile','Meine Mutter · mein Bruder · Ich habe…','haben · possessives · plural','👨‍👩‍👧'],['Sayılar & Telefon','0–100 · Telefonnummer · Preis','numbers · wie viel','🔢'],['Saat & Tarih','Wie spät ist es? · Heute ist…','time expressions · days · months','⏰'],['Günlük Rutin','Ich arbeite · Ich lerne · Ich schlafe','regular verbs · word order','☀️'],['Ev & Oda','Zimmer · Küche · Bett · Tisch','articles · plural · es gibt','🏠'],['Şehir & Yön','Wo ist…? · links · rechts · geradeaus','imperatives · prepositions','🗺️'],['Ulaşım','Bus · Zug · Bahnhof · Ticket','mit · zu · der/die/das review','🚆'],['İş & Okul','Arbeit · Beruf · Schule · Termin','modal verbs intro · müssen/können','💼'],['Alışveriş','Ich möchte… · Wie viel kostet das?','Akkusativ intro · ein/einen','🛍️'],['Yeme & İçme','Essen · Trinken · Frühstück · Restaurant','möchten · kein/keine · gern','🍎'],['Restoran','Die Speisekarte · Rechnung · Bestellung','polite requests · möchten','🍽️'],['Sağlık','Arzt · Apotheke · Schmerzen · Hilfe','haben + body · imperatives','🩺'],['Hava & Mevsimler','Sonne · Regen · kalt · warm','es ist · sein review','🌦️'],['Hobi & Boş Zaman','Musik · Fußball · Freunde · Wochenende','mögen · gern · nicht gern','🎮'],['Seyahat & Otel','Zimmer buchen · Ankunft · Abfahrt','fragen · Uhrzeit · simple messages','🧳'],['Mesaj & Randevu','Termin machen · absagen · treffen','word order · conjunction und/aber','💬'],['A1 Final','Hören · Lesen · Schreiben · Sprechen','mixed A1 review + mock exam','🏆']
];
const detail={
'0':{title:'Ders 1 · Selamlaşma',steps:[
['Önce anlam','Hallo = Merhaba\nGuten Morgen = Günaydın\nGuten Tag = İyi günler\nGuten Abend = İyi akşamlar\nTschüss = Hoşça kal','👋'],
['Sesli tekrar','Her ifadeyi dinle. Sonra 2 kez sesli söyle. Amaç ezber değil, otomatikleşme.','🔊'],
['Hatırla','Sabah 05–11 → Guten Morgen ☀️\n11–18 → Guten Tag 👋\n18–22 → Guten Abend 🌆','🕒'],
['Hatırlamadan üret','Kendine sor: “Birine sabah nasıl selam veririm?” → Guten Morgen!','🧠'],
['Mini test','Doğru seçeneği seç: “İyi akşamlar” hangisi?','✅'],
['Diyalog','Fuchsi: Hallo! Wie geht’s dir?\nSen: Mir geht es gut.\nFuchsi: Super!','🦊'],
['Görev','3 saniye içinde “Merhaba, günaydın” de: Hallo! Guten Morgen!','🚀']
]}
};
let state=JSON.parse(localStorage.getItem('fuchsi')||'null')||{name:'Hasan',fp:0,coins:120,streak:7,level:1,city:'Berlin',unit:1,seen:{},next:{},avatar:'🧑🏻‍💼',daily:{date:'',count:0}};
function touchDay(){const d=new Date().toISOString().slice(0,10);if(state.daily.date!==d){const old=state.daily.date;const prev=new Date(old||d);const now=new Date(d);const diff=Math.round((now-prev)/86400000);if(old && diff===1)state.streak++; else if(old&&diff>1)state.streak=1; state.daily={date:d,count:0};save();}}
touchDay();
function save(){localStorage.setItem('fuchsi',JSON.stringify(state))}
function greet(){let h=new Date().getHours(); if(h<5)return 'Gute Nacht'; if(h<11)return 'Guten Morgen'; if(h<18)return 'Guten Tag'; if(h<22)return 'Guten Abend'; return 'Gute Nacht'}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1800)}
function addFP(n){state.fp+=n;state.coins+=Math.max(0,Math.floor(n/20));state.daily.count=Math.min(5,(state.daily.count||0)+(n>=20?1:0));save();toast('+'+n+' FP 🎉')}
function nav(active){return `<div class="nav"><div class="navin">${[['home','🏠','Ana Sayfa'],['map','🗺️','Almanya'],['lessons','📚','Dersler'],['fuchsi','🦊','Fuchsi'],['profile','👤','Profil']].map(([id,ic,tx])=>`<button class="${active===id?'active':''}" onclick="go('${id}')"><b>${ic}</b>${tx}</button>`).join('')}</div></div>`}
function layout(body,active){document.getElementById('app').innerHTML=`${body}${nav(active)}`}
function top(){return `<div class="top"><div class="toprow"><div class="brand">🦊 Fuchsi Travel</div><div class="stats"><div class="pill">🔥 ${state.streak} gün</div><div class="pill">⭐ ${state.fp} FP</div><div class="pill">🪙 ${state.coins}</div></div></div></div>`}
function home(){layout(`${top()}<main class="screen"><div class="hero"><img src="fuchsi_hero.png"><div class="bubble"><b>${greet()}, ${state.name}! ☀️</b><small>Heute lernen wir in Berlin! Fuchsi hazır. 🦊</small></div></div><div class="levelcard"><div class="lvlrow"><img class="citythumb" src="fuchsi_hero.png"><div class="meta"><div class="small">Level 1 · Berlin</div><div class="lvlname">Selamlaşma</div><div class="bar"><i style="width:${Math.min(100,Math.round((state.fp%500)/5))}%"></i></div><div class="small">${state.fp%500} / 500 FP</div></div></div><button class="cta" onclick="lesson(0)">Derse Başla 🚀</button></div><div class="grid4"><div class="tile" onclick="go('lessons')"><b>📗</b>Kelimeler</div><div class="tile" onclick="go('lessons')"><b>💬</b>Kalıplar</div><div class="tile" onclick="go('lessons')"><b>🎓</b>Gramer</div><div class="tile" onclick="go('map')"><b>🇩🇪</b>Almanya</div></div><div class="section"><div class="rowcard daily"><div class="ring"><span>${state.daily.count||0}/5</span></div><div><b>Günlük Hedef</b><div class="small">Bugün ${(state.daily.count||0)} ders tamamladın · 5'e ulaş ve ekstra ödül kazan</div></div></div><div class="rowcard" onclick="go('fuchsi')"><div class="lesson"><div class="ico">🦊</div><div class="meta"><strong>Fuchsi ile Sohbet</strong><span class="small">A1 seviyesinde konuş, hata yap, düzelt, tekrar et.</span></div><span>›</span></div></div></div></main>`,'home')}
function lessons(){layout(`${top()}<main class="screen"><div class="pagehead"><button class="back" onclick="go('home')">‹</button><div><h2>Dersler</h2><div class="sub">A1 · Berlin’den başlayıp Almanya’yı keşfet</div></div></div><div class="tabs"><span class="tab on">A1</span><span class="tab">A2</span><span class="tab">B1</span><span class="tab">B2</span></div>${units.map((u,i)=>`<div class="rowcard" onclick="lesson(${i})"><div class="lesson"><div class="ico">${u[3]}</div><div class="meta"><strong>${i+1}. ${u[0]}</strong><span class="small">${u[1]}</span><div class="small">${u[2]}</div></div><span class="lock">${i<3?'✅':i<state.unit+1?'▶️':'🔒'}</span></div></div>`).join('')}</main>`,'lessons')}
function mapPage(){layout(`${top()}<main class="screen"><div class="pagehead"><button class="back" onclick="go('home')">‹</button><div><h2>Almanya Yolculuğu</h2><div class="sub">Her şehir yeni bir A1 becerisi açar.</div></div></div><div class="map"><div class="route"></div>${[['berlin','Berlin',1,'Selamlaşma'],['hamburg','Hamburg',2,'Kendini Tanıtma'],['koln','Köln',3,'Aile'],['munich','München',4,'Günlük Rutin'],['frank','Frankfurt',5,'A1 Final']].map((x,i)=>`<div class="city ${i>state.level?'locked':''} ${x[0]}" onclick="${i<=state.level?'lesson('+(i*4)+')':'toast(\'Önce önceki şehri tamamla 🔒\')'}"><b>${x[1]}</b><small>Level ${x[2]} · ${x[3]} ${i>state.level?'🔒':'✨'}</small></div>`).join('')}</div></main>`,'map')}
function lesson(i){if(i>=units.length)return; const u=units[i]; const d=detail[i]||{title:'Ünite '+(i+1)+' · '+u[0],steps:[['Hedef',u[1]+'\n\nBugünkü hedef: kelimeyi tanımak, cümlede kullanmak ve kısa bir konuşmada üretmek.','🎯'],['Öğren',u[2]+'\n\nÖnce örneği incele. Sonra bakmadan söyle.','📘'],['Örnek',exampleFor(i),'💡'],['Hatırlama','Ekrandan çekmeden cevapla: Almancayı sen üret.','🧠'],['Dinle','Cümleyi önce dinle, sonra gölgeleme (shadowing) ile tekrar et.','🔊'],['Mini test','Doğru cevabı seç ve hemen geri bildirim al.','✅'],['Görev','Bugün bunu gerçek hayatta nerede kullanırsın? Bir cümle kur.','🚀']]}; lessonState={i,step:0,steps:d.steps}; renderLesson()}
let lessonState={i:0,step:0,steps:[]};
function exampleFor(i){const ex=[['Hallo! Wie geht’s dir?','Merhaba! Nasılsın?'],['Ich heiße Hasan.','Benim adım Hasan.'],['Ich komme aus der Türkei.','Türkiye’den geliyorum.'],['Das ist meine Mutter.','Bu benim annem.'],['Meine Telefonnummer ist …','Telefon numaram …'],['Wie spät ist es?','Saat kaç?'],['Ich arbeite am Montag.','Pazartesi çalışıyorum.'],['Das ist meine Küche.','Bu benim mutfağım.'],['Wo ist der Bahnhof?','Tren istasyonu nerede?'],['Ich fahre mit dem Bus.','Otobüsle gidiyorum.'],['Ich kann heute nicht.','Bugün yapamam.'],['Ich möchte einen Kaffee.','Bir kahve istiyorum.'],['Ich esse gern Äpfel.','Elma yemeyi severim.'],['Die Rechnung, bitte.','Hesabı alabilir miyim?'],['Ich habe Kopfschmerzen.','Başım ağrıyor.'],['Heute ist es kalt.','Bugün hava soğuk.'],['Ich mag Musik.','Müziği severim.'],['Ich habe ein Zimmer reserviert.','Bir oda rezerve ettim.'],['Hast du am Freitag Zeit?','Cuma günü vaktin var mı?'],['Ich kann mich vorstellen.','Kendimi tanıtabilirim.']]; return ex[i][0]+'\n'+ex[i][1]}
function speak(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang='de-DE';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function renderLesson(){const s=lessonState; const [title,desc,icon]=s.steps[s.step]; const pct=Math.round((s.step)/(s.steps.length-1)*100); layout(`${top()}<main class="screen"><div class="pagehead"><button class="back" onclick="go('lessons')">‹</button><div><h2>${units[s.i][0]}</h2><div class="sub">Adım ${s.step+1}/${s.steps.length}</div></div></div><div class="progressline"><i style="width:${pct}%"></i></div><div class="challenge" style="margin-top:14px"><div style="font-size:34px;text-align:center">${icon}</div><h2 style="text-align:center">${title}</h2><p style="white-space:pre-line;line-height:1.55">${desc}</p>${s.step<4?`<button class="speaker" onclick="speak('${escapeHtml(desc.split('\n')[0])}')">🔊</button>`:''}${s.step===4?`<button class="choice" onclick="quizChoice(this,false)">Guten Morgen</button><button class="choice" onclick="quizChoice(this,true)">Guten Abend</button><button class="choice" onclick="quizChoice(this,false)">Hallo</button>`:''}${s.step===5?`<div class="chat"><img class="foxmini" src="fuchsi_hero.png"><div class="bubblemsg">Hallo! Wie geht’s dir?</div></div><div class="chat you"><div class="bubblemsg">Mir geht es gut. 😊</div></div>`:''}<button class="cta" id="lessonBtn" onclick="nextLessonStep()">${s.step===s.steps.length-1?'Dersi Tamamla 🎉':'Devam Et →'}</button></div></main>`,'lessons')}
function quizChoice(el,good){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('good','bad'));el.classList.add(good?'good':'bad');if(good){addFP(10);el.textContent='✅ Doğru!'}else{el.textContent='❌ Tekrar düşün'}}
function nextLessonStep(){if(lessonState.step<lessonState.steps.length-1){lessonState.step++;renderLesson();return;} addFP(25);state.unit=Math.max(state.unit,lessonState.i+1);save();toast('Ders tamamlandı!');go('lessons')}
function fuchsi(){layout(`${top()}<main class="screen"><div class="pagehead"><button class="back" onclick="go('home')">‹</button><div><h2>Fuchsi ile Sohbet</h2><div class="sub">A1 · Hata yapman serbest, öğrenmek zorunlu 🦊</div></div></div><div class="rowcard"><b>🤖 Öğretmen modu</b><div class="small">Cevapların kısa, anlaşılır ve seviyene uygun tutulur. Hatalarda doğru cümle + mini açıklama + tekrar gelir.</div></div><div id="chatbox"></div><div class="inputrow"><input id="chatin" placeholder="Bir şey yaz… Örn. Mir geht gut."><button class="send" onclick="sendChat()">➤</button></div></main>`,'fuchsi');seedChat()}
function seedChat(){const b=document.getElementById('chatbox'); b.innerHTML=`<div class="chat"><img class="foxmini" src="fuchsi_hero.png"><div class="bubblemsg"><b>Hallo ${state.name}! 👋</b><br>Wie geht’s dir heute?<br><button class="tinybtn" onclick="speak('Wie geht’s dir heute?')">🔊 Dinle</button></div></div><div class="chat"><img class="foxmini" src="fuchsi_hero.png"><div class="bubblemsg">İstersen Almanca cevap ver. Hata yaparsan birlikte düzeltiriz.</div></div>`}
function sendChat(){const inp=document.getElementById('chatin'),v=inp.value.trim();if(!v)return;const b=document.getElementById('chatbox');b.innerHTML+=`<div class="chat you"><div class="bubblemsg">${escapeHtml(v)}</div></div>`;const r=tutor(v);b.innerHTML+=`<div class="chat"><img class="foxmini" src="fuchsi_hero.png"><div class="bubblemsg">${r}</div></div>`;inp.value='';addFP(5);document.getElementById('chatbox').lastElementChild.scrollIntoView({behavior:'smooth'})}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function tutor(v){let x=v.toLowerCase();if(x.includes('mir geht gut'))return `Fast! 😊<br><b>Doğrusu:</b> Mir geht <b>es</b> gut.<br><span class="muted">Burada “es” gerekir. Şimdi sen tekrar yaz: <b>Mir geht es gut.</b></span>`;if(x.includes('ich bin gut'))return `Güzel deneme! 🦊<br>“Nasılsın?” için en doğal A1 kalıbı: <b>Mir geht es gut.</b>`;if(x.includes('hallo')||x.includes('guten morgen'))return `Sehr gut! 👏<br><b>Guten Morgen!</b> sabah kullanılan selamlaşmadır. Devam: <b>Wie geht’s dir?</b>`;if(x.includes('heiße')||x.includes('heisse'))return `Perfekt! 🎉<br><b>Ich heiße ${state.name}.</b> çok güzel. Şimdi sor: <b>Wie heißt du?</b>`;if(x.includes('wo')&&x.includes('wohn'))return `Doğru konu! 🏠<br><b>Wo wohnst du?</b> → <b>Ich wohne in …</b>`;return `Super! 🦊 A1 seviyesinde devam edelim.<br><b>“${escapeHtml(v)}”</b> cümleni biraz daha uzatmayı dene. Bir zaman, yer veya kişi ekle. Örneğin: <b>Heute … / In Berlin … / Mit meiner Familie …</b>`}
function profile(){const name=state.name||'Hasan';layout(`${top()}<main class="screen"><div class="pagehead"><h2>Profil</h2></div><div class="avatarPreview"><div class="avatarBig" id="bigAv">${state.avatar}</div><b style="font-size:20px">${name}</b><div class="small">Level ${state.level} · Berlin</div><button class="tinybtn" style="margin-top:8px" onclick="avatar()">Avatarı Düzenle</button></div><div class="rowcard"><b>📊 İstatistikler</b><div class="grid4" style="margin-top:10px"><div class="tile"><b>🔥</b>${state.streak}<span class="small">Seri</span></div><div class="tile"><b>⭐</b>${state.fp}<span class="small">FP</span></div><div class="tile"><b>🪙</b>${state.coins}<span class="small">Coin</span></div><div class="tile"><b>📚</b>${state.unit}/20<span class="small">Ünite</span></div></div></div><div class="section"><div class="rowcard achievement"><div class="badge">🏅</div><div><b>Berlin Başlangıcı</b><div class="small">İlk dersini tamamla · ✅</div></div></div><div class="rowcard achievement"><div class="badge">🦊</div><div><b>Fuchsi Dostu</b><div class="small">Fuchsi ile konuş · +20 FP</div></div></div></div></main>`,'profile')}
function avatar(){const faces=['🧑🏻‍💼','👩🏻‍💼','🧑🏽‍🎓','👩🏽‍🎓','🧑🏿‍💻','👩🏿‍💻','🧔🏻','👩🏻‍🦰','👨🏽‍🦱','👩🏽‍🦱','🧑🏼‍🎨','👨🏻‍🦲'];layout(`${top()}<main class="screen"><div class="pagehead"><button class="back" onclick="go('profile')">‹</button><div><h2>Avatarını oluştur</h2><div class="sub">Kız/erkek ve stil seçeneklerini seç</div></div></div><div class="avatarPreview"><div class="avatarBig" id="avbig">${state.avatar}</div><div class="swatches"><i class="sw" style="background:#f6c39a"></i><i class="sw" style="background:#d99566"></i><i class="sw" style="background:#9c5b38"></i><i class="sw" style="background:#5a311f"></i><i class="sw" style="background:#3e251b"></i></div></div><div class="rowcard"><b>Avatar türü</b><div class="tabs"><span class="tab on">Erkek</span><span class="tab">Kız</span><span class="tab">Nötr</span></div><div class="avatarGrid">${faces.map(f=>`<div class="av ${state.avatar===f?'sel':''}" onclick="pickAv('${f}')"><div class="face">${f}</div></div>`).join('')}</div></div><div class="rowcard"><b>Saç / Gözlük / Kıyafet</b><div class="small" style="margin-top:5px">İleride mağazadan Fuchsi Coin ile yeni kozmetikler açılacak.</div></div><button class="cta" onclick="go('profile')">Kaydet ✅</button></main>`,'profile')}
function pickAv(f){state.avatar=f;save();avatar();toast('Avatar güncellendi')}
function go(x){if(x==='home')home();else if(x==='map')mapPage();else if(x==='lessons')lessons();else if(x==='fuchsi')fuchsi();else if(x==='profile')profile()}
function init(){home();}
init();
</script>
<div id="installBanner" class="rowcard hidden" style="position:fixed;left:14px;right:14px;bottom:86px;z-index:25;background:#fff;border:1px solid #ffe0c8">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="font-size:30px">🦊</div>
    <div style="flex:1"><b>Fuchsi Travel'ı yükle</b><div class="small">Ana ekranda uygulama gibi açılsın.</div></div>
    <button class="tinybtn" style="background:var(--orange);color:#fff" onclick="installPwa()">Yükle</button>
  </div>
</div>
<script>
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=document.getElementById('installBanner');if(b)b.classList.remove('hidden')});
async function installPwa(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;const b=document.getElementById('installBanner');if(b)b.classList.add('hidden')}
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBanner');if(b)b.classList.add('hidden')});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
